<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
	<script>
        (function() {
            var ua = navigator.userAgent;
            if (ua.indexOf("Line") > -1) {
                var url = window.location.href;
                if (url.indexOf('openExternalBrowser=1') === -1) {
                    var separator = url.indexOf('?') === -1 ? '?' : '&';
                    window.location.replace(url + separator + 'openExternalBrowser=1');
                }
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友魚勇者之路-單人版</title>
    <link rel="stylesheet" href="style.css">

    <!-- ══ 開場 CSS（內聯，強制覆蓋一切）══ -->
    <style>
      #intro-screen {
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        width: 100% !important; height: 100% !important;
        z-index: 99999 !important;
        background: #000 !important;
        overflow: hidden !important;
        cursor: pointer;
        font-family: Georgia, serif;
      }
      /* 暗角 vignette（無遮幅，全屏） */
      #intro-vig {
        position: absolute; inset: 0; z-index: 9; pointer-events: none;
        background: radial-gradient(ellipse at center,
          transparent 50%, rgba(0,0,0,.70) 100%);
      }
      /* 過場黑幕 */
      #intro-blk {
        position: absolute; inset: 0; background: #000;
        z-index: 8; opacity: 0; pointer-events: none;
        transition: opacity 1.1s cubic-bezier(.4,0,.2,1);
      }
      /* 掃光（過場特效） */
      #intro-scan {
        position: absolute; inset: 0; z-index: 11; pointer-events: none;
        background: linear-gradient(to bottom,
          transparent 0%,
          rgba(255,255,255,.02) 46%,
          rgba(255,255,255,.08) 50%,
          rgba(255,255,255,.02) 54%,
          transparent 100%);
        opacity: 0; transform: translateY(-100%);
      }
      #intro-scan.sweep {
        animation: iSweep 1.1s cubic-bezier(.4,0,.6,1) forwards;
      }
      @keyframes iSweep {
        0%   { opacity:0; transform:translateY(-100%); }
        25%  { opacity:1; }
        100% { opacity:0; transform:translateY(210%); }
      }
      /* 標題幕 */
      #intro-ts {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        z-index: 5;
      }
      /* 撞擊感：每個字獨立出現 */
      #intro-title {
        font-size: clamp(2rem, 7vw, 5rem);
        font-weight: 900; letter-spacing: .22em;
        color: #dff0ff;
        text-shadow:
          0 0 22px rgba(100,200,255,.95),
          0 0 55px rgba(80,170,255,.55),
          0 0 110px rgba(60,140,255,.28);
        white-space: nowrap;
        display: flex; gap: .12em;
      }
      /* 每個字的撞擊動畫 */
      .i-char {
        display: inline-block;
        opacity: 0;
        animation: iImpact .38s cubic-bezier(.22,.61,.36,1) forwards;
      }
      @keyframes iImpact {
        0%   { opacity:0; transform: scale(1.55) translateY(-8px); filter: brightness(2.5); }
        45%  { opacity:1; transform: scale(.92) translateY(3px);  filter: brightness(1.4); }
        70%  { transform: scale(1.04) translateY(-1px); filter: brightness(1.1); }
        100% { opacity:1; transform: scale(1) translateY(0);      filter: brightness(1); }
      }
      /* 全部打完後整體脈衝 */
      #intro-title.done {
        animation: iPulse 3s ease-in-out infinite;
      }
      @keyframes iPulse {
        0%,100%{ text-shadow:0 0 22px rgba(100,200,255,.95),0 0 55px rgba(80,170,255,.55); }
        50%{ text-shadow:0 0 38px rgba(100,200,255,1),0 0 95px rgba(80,170,255,.9),0 0 160px rgba(60,140,255,.5); }
      }
      /* 提示：底部正中，灰色，1.2x，閃慢 */
      #intro-hint {
        position: absolute;
        bottom: 28px;
        left: 50%; transform: translateX(-50%);
        font-size: clamp(.9rem, 2.5vw, 1.08rem); /* 1.2x */
        letter-spacing: .28em; white-space: nowrap;
        color: rgba(140,140,140,0);
        transition: color 1.4s ease;
        animation: iHint 3s ease-in-out infinite; /* 0.3x 速度，原1.9s→3s再擴大→6s感覺差距*/
        z-index: 20;
      }
      #intro-hint.show { color: rgba(138,138,138,.82); }
      @keyframes iHint { 0%{opacity:.15} 25%{opacity:1} 75%{opacity:.9} 100%{opacity:.15} }
      /* 漫畫幕：全屏無黑邊 */
      #intro-cs {
        position: absolute; inset: 0; z-index: 4; display: none;
      }
      .iimg {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        filter: saturate(.87) brightness(.9);
        opacity: 0; transform: scale(1.06);
        will-change: transform, opacity;
      }
      /* 前6秒出場動作，後6秒靜止 */
      .iimg.breath {
        animation: iBreath 6s cubic-bezier(.25,.46,.45,.94) forwards;
      }
      @keyframes iBreath {
        0%   { transform: scale(1.06); }
        100% { transform: scale(1.00); }
      }
      /* 閃光特效（每張圖進場時） */
      #intro-flash {
        position: absolute; inset: 0; z-index: 13; pointer-events: none;
        background: #fff; opacity: 0;
      }
      #intro-flash.pop {
        animation: iFlash .55s ease-out forwards;
      }
      @keyframes iFlash {
        0%   { opacity:.18; }
        100% { opacity:0; }
      }
      /* 頁碼：全屏右下 */
      #intro-pgnum {
        position: absolute; bottom: 18px; right: 20px;
        z-index: 12; color: rgba(255,255,255,.28);
        font-size: .65rem; letter-spacing: .1em;
        font-family: monospace; pointer-events: none;
      }
      /* SKIP：極淡半透明 */
      #intro-skip {
        position: fixed;
        bottom: 16px; right: 18px;
        z-index: 999999;
        background: rgba(0,0,0,.25);
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 22px;
        color: rgba(255,255,255,.75);
        font-size: .76rem; letter-spacing: .1em;
        padding: 6px 16px; cursor: pointer;
        backdrop-filter: blur(3px);
        display: none;
        transition: color .3s, border-color .3s, background .3s;
      }
      #intro-skip:hover {
        color: #fff;
        border-color: rgba(255,255,255,.6);
        background: rgba(0,0,0,.45);
      }
      /* ── 特效層 ── */

      /* M 暗角呼吸 */
      #fx-vignette {
        position:absolute; inset:0; z-index:15; pointer-events:none;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0) 100%);
        transition: background 0.5s ease;
      }
      #fx-vignette.breathe {
        animation: fxVig 3s ease-in-out infinite;
      }
      @keyframes fxVig {
        0%,100%{ background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.55) 100%); }
        50%    { background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.82) 100%); }
      }

      /* F 鏡頭震動 */
      @keyframes fxShake {
        0%  { transform:translate(0,0) rotate(0deg); }
        15% { transform:translate(-4px,3px) rotate(-.3deg); }
        30% { transform:translate(5px,-2px) rotate(.2deg); }
        45% { transform:translate(-3px,4px) rotate(-.2deg); }
        60% { transform:translate(4px,-3px) rotate(.3deg); }
        75% { transform:translate(-2px,2px) rotate(0deg); }
        100%{ transform:translate(0,0) rotate(0deg); }
      }
      #intro-cs.shake {
        animation: fxShake .55s cubic-bezier(.36,.07,.19,.97) forwards;
      }

      /* A 粒子 */
      #fx-particles {
        position:absolute; inset:0; z-index:16; pointer-events:none; overflow:hidden;
      }
      .fx-p {
        position:absolute;
        border-radius:50%;
        opacity:0;
        animation: fxPFloat var(--pd,4s) ease-in-out var(--delay,0s) forwards;
      }
      @keyframes fxPFloat {
        0%   { opacity:0; transform:translateY(0) scale(1); }
        20%  { opacity:.9; }
        100% { opacity:0; transform:translateY(var(--py,-120px)) scale(.4); }
      }

      /* B 光暈脈衝 */
      #fx-halo {
        position:absolute; z-index:16; pointer-events:none;
        border-radius:50%;
        background: radial-gradient(circle, rgba(255,220,100,.35) 0%, transparent 70%);
        opacity:0;
      }
      #fx-halo.pulse {
        animation: fxHalo 2.5s ease-in-out infinite;
      }
      @keyframes fxHalo {
        0%,100%{ opacity:.3; transform:scale(1);   }
        50%    { opacity:.7; transform:scale(1.18); }
      }

      /* E 掃描線 */
      #fx-scan {
        position:absolute; inset:0; z-index:16; pointer-events:none;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px, transparent 2px,
          rgba(80,200,255,.12) 2px, rgba(80,200,255,.12) 3px
        );
        opacity:0;
      }
      #fx-scan.sweep {
        animation: fxScanIn .5s ease forwards, fxScanPulse 1.2s ease-in-out .5s infinite;
      }
      @keyframes fxScanIn {
        0%  { opacity:0; transform:translateX(-100%); }
        100%{ opacity:1; transform:translateX(0); }
      }
      @keyframes fxScanPulse {
        0%,100%{ opacity:.6; }
        50%    { opacity:1; }
      }

      /* G 色彩偏移 */
      #fx-glitch {
        position:absolute; inset:0; z-index:17; pointer-events:none;
        opacity:0; mix-blend-mode:screen;
      }
      #fx-glitch.go {
        animation: fxGlitch 1.2s steps(1) forwards;
      }
      @keyframes fxGlitch {
        0%  { opacity:0; }
        8%  { opacity:1; background:rgba(255,0,0,.18); transform:translate(-5px,0) scaleY(1.01); }
        18% { background:rgba(0,255,255,.18); transform:translate(6px,0); }
        28% { background:rgba(255,0,0,.14); transform:translate(-4px,2px) scaleY(.99); }
        38% { background:rgba(0,255,255,.14); transform:translate(5px,-2px); }
        50% { background:rgba(255,0,0,.10); transform:translate(-3px,0); }
        62% { background:rgba(0,255,255,.10); transform:translate(3px,0); }
        75% { background:rgba(255,0,0,.06); transform:translate(-1px,0); }
        88% { opacity:.4; }
        100%{ opacity:0; transform:translate(0,0); }
      }

      /* H 聚光燈 */
      #fx-spotlight {
        position:absolute; inset:0; z-index:15; pointer-events:none;
        opacity:0;
        background: radial-gradient(circle 28% at 50% 50%, transparent 0%, rgba(0,0,0,.52) 100%);
        transition: opacity 1.5s ease;
      }
      #fx-spotlight.on { opacity:1; animation: fxSpot 6s ease-in-out infinite; }
      @keyframes fxSpot {
        0%,100%{ background: radial-gradient(circle 28% at 50% 42%, transparent 0%, rgba(0,0,0,.52) 100%); }
        50%    { background: radial-gradient(circle 28% at 52% 55%, transparent 0%, rgba(0,0,0,.52) 100%); }
      }

      /* I 漣漪 */
      #fx-ripple {
        position:absolute; z-index:16; pointer-events:none;
        border-radius:50%;
        border: 3px solid rgba(100,200,255,.85);
        box-shadow: 0 0 12px rgba(100,200,255,.5), inset 0 0 12px rgba(100,200,255,.2);
        opacity:0; transform:scale(0);
      }
      #fx-ripple.go {
        animation: fxRipple 2.2s ease-out forwards;
      }
      #fx-ripple2 {
        position:absolute; z-index:16; pointer-events:none;
        border-radius:50%;
        border: 2px solid rgba(100,200,255,.6);
        box-shadow: 0 0 8px rgba(100,200,255,.3);
        opacity:0; transform:scale(0);
      }
      #fx-ripple2.go {
        animation: fxRipple 2.2s ease-out .55s forwards;
      }
      #fx-ripple3 {
        position:absolute; z-index:16; pointer-events:none;
        border-radius:50%;
        border: 1px solid rgba(100,200,255,.4);
        opacity:0; transform:scale(0);
      }
      #fx-ripple3.go {
        animation: fxRipple 2.2s ease-out 1.1s forwards;
      }
      @keyframes fxRipple {
        0%  { opacity:1;  transform:scale(0); }
        100%{ opacity:0;  transform:scale(1); }
      }

      /* K 天氣粒子（橙紅塵埃） */
      #fx-weather {
        position:absolute; inset:0; z-index:16; pointer-events:none; overflow:hidden;
      }
      .fx-w {
        position:absolute; top:-5px;
        border-radius:50%; opacity:0;
        animation: fxWeather var(--wd,6s) linear var(--wdelay,0s) forwards;
      }
      @keyframes fxWeather {
        0%  { opacity:0;   transform:translateY(0) translateX(0); }
        10% { opacity:.75; }
        90% { opacity:.5;  }
        100%{ opacity:0;   transform:translateY(110vh) translateX(var(--wx,20px)); }
      }
        animation: iClose 1.5s ease forwards;
        pointer-events: none;
      }
      @keyframes iClose { to { opacity: 0; } }
    </style>

    <!-- ══ 歡迎頁樣式 ══ -->
    <style>
    #welcome-screen {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.42)),
            url('bgi.png') no-repeat center center;
        background-size: cover;
        opacity: 0;
        animation: welcomeFadeIn 1.5s ease-in-out forwards;
        transition: opacity 1.2s ease-in-out, visibility 1.2s;
        overflow: hidden;
    }
    @keyframes welcomeFadeIn { from{opacity:0} to{opacity:1} }
    #welcome-screen.fade-out  { opacity:0; visibility:hidden; }
    #welcome-screen.hidden    { opacity:0; visibility:hidden; pointer-events:none; }

    /* 光柱 */
    #ws-rays { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
    .ws-ray  {
        position:absolute; top:-6%;
        background:linear-gradient(180deg,rgba(160,210,255,0.15) 0%,transparent 100%);
        transform-origin:top center;
        animation:wsRayPulse 8s ease-in-out infinite;
    }
    .ws-ray:nth-child(1){ left:18%; width:28px; height:55%; transform:rotate(-22deg); animation-delay:0s; }
    .ws-ray:nth-child(2){ left:38%; width:52px; height:62%; transform:rotate(-8deg);  animation-delay:-2.8s; opacity:.75; }
    .ws-ray:nth-child(3){ left:57%; width:36px; height:58%; transform:rotate(6deg);   animation-delay:-5s; }
    .ws-ray:nth-child(4){ left:76%; width:22px; height:48%; transform:rotate(20deg);  animation-delay:-1.8s; }
    @keyframes wsRayPulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* 暗角 */
    #ws-vignette {
        position:absolute; inset:0; pointer-events:none; z-index:2;
        background:
            radial-gradient(ellipse at center, transparent 35%, rgba(4,10,28,0.6) 100%),
            linear-gradient(to top, rgba(4,10,28,0.75) 0%, transparent 32%);
    }

    /* 泡泡 */
    .ws-mbubble {
        position:absolute; border-radius:50%;
        border:1px solid rgba(160,220,255,0.35);
        background:transparent;
        animation:wsBubRise linear infinite;
        pointer-events:none; z-index:2;
    }
    @keyframes wsBubRise {
        0%  { transform:translateY(0);      opacity:.5; }
        100%{ transform:translateY(-110vh); opacity:0;  }
    }

    /* 容器 */
    .ws-container {
        position:relative; z-index:5;
        width:88%; max-width:360px;
        display:flex; flex-direction:column; align-items:center;
    }

    /* 標題 */
    .ws-title-block { text-align:center; margin-bottom:20px; }
    .ws-game-title {
        font-size:clamp(2rem,8vw,2.8rem);
        font-weight:900; color:white; letter-spacing:.1em;
        text-shadow:
            0 0 10px rgba(255,255,255,0.85),
            0 0 22px rgba(79,195,247,0.85),
            0 0 48px rgba(3,169,244,0.65);
        margin-bottom:4px;
    }
    .ws-subtitle { font-size:.82rem; color:rgba(180,225,255,0.55); letter-spacing:.28em; }
    .ws-deco-line {
        display:flex; align-items:center; justify-content:center;
        gap:10px; margin-top:10px;
    }
    .ws-deco-line::before,.ws-deco-line::after {
        content:''; height:1px; width:50px;
        background:linear-gradient(90deg,transparent,rgba(140,200,255,0.32),transparent);
    }

    /* 設定卡片 */
    .ws-card {
        width:100%;
        background:rgba(4,12,30,0.70);
        border:1px solid rgba(100,180,255,0.17);
        border-radius:18px;
        padding:20px 18px 18px;
        backdrop-filter:blur(5px);
        -webkit-backdrop-filter:blur(5px);
        margin-bottom:14px;
        display:flex; flex-direction:column; gap:16px;
    }
    .ws-field-label {
        font-size:.68rem; letter-spacing:.2em;
        color:rgba(120,190,255,0.52); margin-bottom:7px;
    }

    /* 名稱輸入 */
    .ws-name-input {
        width:100%;
        background:rgba(255,255,255,0.055);
        border:1px solid rgba(100,180,255,0.22);
        border-radius:10px;
        padding:10px 13px;
        color:#c8eeff; font-size:.95rem;
        font-family:"Microsoft JhengHei",sans-serif;
        outline:none; transition:border-color .2s;
        -webkit-user-select:text; user-select:text;
    }
    .ws-name-input::placeholder { color:rgba(140,190,255,0.3); }
    .ws-name-input:focus { border-color:rgba(100,200,255,0.55); }

    /* 難度 */
    .ws-diff-row { display:flex; gap:7px; }
    .ws-diff-btn {
        flex:1; padding:9px 0; border-radius:10px;
        border:1px solid rgba(100,180,255,0.18);
        background:rgba(255,255,255,0.04);
        color:rgba(160,215,255,0.58);
        font-size:.82rem; cursor:pointer;
        transition:all .18s;
        font-family:"Microsoft JhengHei",sans-serif;
        -webkit-tap-highlight-color:transparent;
    }
    .ws-diff-btn:active { transform:scale(0.95); }
    .ws-diff-btn.ws-active {
        background:rgba(255,183,77,0.18);
        border-color:rgba(255,183,77,0.58);
        color:#ffd082; font-weight:700;
    }

    /* 音效開關 */
    .ws-sound-wrap {
        display:flex; align-items:center;
        justify-content:space-between; padding:2px 0;
    }
    .ws-sound-label {
        font-size:.85rem; color:rgba(160,215,255,0.72);
        font-family:"Microsoft JhengHei",sans-serif;
        display:flex; align-items:center; gap:7px;
    }
    .ws-toggle {
        width:44px; height:24px; border-radius:12px;
        border:1px solid rgba(100,180,255,0.22);
        background:rgba(255,255,255,0.07);
        position:relative; cursor:pointer;
        transition:background .22s, border-color .22s;
        flex-shrink:0; -webkit-tap-highlight-color:transparent;
    }
    .ws-toggle.ws-on {
        background:rgba(255,183,77,0.38);
        border-color:rgba(255,183,77,0.65);
    }
    .ws-toggle::after {
        content:''; position:absolute; top:3px; left:3px;
        width:17px; height:17px; border-radius:50%;
        background:rgba(160,210,255,0.65);
        transition:transform .22s, background .22s;
    }
    .ws-toggle.ws-on::after { transform:translateX(20px); background:#ffcf6e; }

    /* 主按鈕 */
    #ws-start-btn {
        width:100%; padding:16px; border-radius:50px; border:none;
        background:linear-gradient(135deg,#ffb74d,#ff7043);
        color:white; font-size:1.3rem; font-weight:900;
        letter-spacing:.1em; cursor:pointer;
        font-family:"Microsoft JhengHei","Noto Serif TC",serif;
        box-shadow:0 5px 15px rgba(0,0,0,0.3),0 0 20px rgba(255,183,77,0.55);
        transition:transform .15s; position:relative; overflow:hidden;
        -webkit-tap-highlight-color:transparent;
    }
    #ws-start-btn::after {
        content:''; position:absolute;
        top:-50%; left:-65%; width:38%; height:200%;
        background:rgba(255,255,255,0.14);
        transform:rotate(30deg);
        animation:wsShimmer 3.5s ease-in-out infinite;
    }
    @keyframes wsShimmer { 0%,55%{left:-65%} 78%{left:135%} 100%{left:135%} }
    #ws-start-btn:active { transform:scale(0.96); }

    /* 次要按鈕 */
    .ws-sub-row { display:flex; gap:10px; width:100%; }
    .ws-sub-btn {
        flex:1; padding:11px 4px; font-size:.95rem;
        border-radius:30px;
        border:2px solid rgba(255,255,255,0.45);
        background:rgba(255,255,255,0.28);
        color:white; cursor:pointer;
        font-family:"Microsoft JhengHei",sans-serif;
        transition:all .18s;
        backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
        -webkit-tap-highlight-color:transparent;
    }
    .ws-sub-btn:active { transform:scale(0.95); background:rgba(255,255,255,0.38); }
    </style>
</head>
<body>

  <!-- ══ 開場畫面 ══ -->
  <div id="intro-screen">
    <div id="intro-vig"></div>
    <div id="intro-blk"></div>
    <div id="intro-scan"></div>
    <div id="intro-flash"></div>

    <!-- 特效層 -->
    <div id="fx-vignette"></div>
    <div id="fx-particles"></div>
    <div id="fx-weather"></div>
    <div id="fx-halo"></div>
    <div id="fx-spotlight"></div>
    <div id="fx-scan"></div>
    <div id="fx-glitch"></div>
    <div id="fx-ripple"></div>
    <div id="fx-ripple2"></div>
    <div id="fx-ripple3"></div>

    <div id="intro-ts">
      <div id="intro-title"></div>
    </div>

    <div id="intro-cs">
      <img id="iimg-a" class="iimg" src="" alt="">
      <img id="iimg-b" class="iimg" src="" alt="">
      <div id="intro-pgnum"></div>
    </div>

    <div id="intro-hint">點擊畫面開場</div>
    <button id="intro-skip" onclick="introSkip()">跳過</button>
  </div>

  <!-- ══ 開場邏輯 ══ -->
  <script>
  if(sessionStorage.getItem('skipIntro')!=='1'){
  (function(){
    var IMGS=['P1.jpg','P2.jpg','P3.jpg','P4.jpg','P5.jpg','P6.jpg','P7.jpg','P8.jpg','P9.jpg'];
    // 每張12秒，其中前6秒是出場動畫，後6秒靜止供閱讀
    var STAY=12000, BREATH_DUR=6000, FADE_OUT=900, BLACK=400, FADE_IN=800;
    var alive=true, slotA=true, bgmEl=null, volTmr=null;
    var imgA,imgB,blkOvl,scanEl,flashEl;

    function fadeVol(to,ms){
      if(!bgmEl)return;
      var from=bgmEl.volume,steps=40,dt=ms/steps,s=0;
      clearInterval(volTmr);
      volTmr=setInterval(function(){
        s++;
        bgmEl.volume=Math.min(1,Math.max(0,from+(to-from)*(s/steps)));
        if(s>=steps)clearInterval(volTmr);
      },dt);
    }

    /* 撞擊式打字機：每字獨立 span，速度 0.8x（144ms/字） */
    var TITLE='友魚勇者之路', ti=0;
    var titleEl=document.getElementById('intro-title');
    var hintEl=document.getElementById('intro-hint');
    function typeImpact(){
      if(ti<TITLE.length){
        var span=document.createElement('span');
        span.className='i-char';
        span.textContent=TITLE[ti];
        /* 每字錯開 delay，製造連續撞擊感 */
        span.style.animationDelay='0s';
        titleEl.appendChild(span);
        ti++;
        setTimeout(typeImpact, 144); /* 原115ms * 1/0.8 = 144ms */
      } else {
        titleEl.classList.add('done');
        setTimeout(function(){ hintEl.classList.add('show'); },600);
      }
    }
    setTimeout(typeImpact, 900);

    var introScr=document.getElementById('intro-screen');
    introScr.addEventListener('click',startComic,{once:true});

    function startComic(){
      bgmEl=document.getElementById('bgm');
      if(bgmEl){
        bgmEl.src='MZ.mp3';
        bgmEl.loop=true;
        bgmEl.volume=0;
        bgmEl.play().catch(function(){});
        fadeVol(1,2200);
      }
      var ts=document.getElementById('intro-ts');
      ts.style.transition='opacity .55s';
      ts.style.opacity='0';
      setTimeout(function(){ ts.style.display='none'; },560);

      document.getElementById('intro-cs').style.display='block';
      document.getElementById('intro-skip').style.display='block';
      document.getElementById('intro-hint').style.display='none';

      imgA=document.getElementById('iimg-a');
      imgB=document.getElementById('iimg-b');
      blkOvl=document.getElementById('intro-blk');
      scanEl=document.getElementById('intro-scan');
      flashEl=document.getElementById('intro-flash');
      showImg(0);
    }

    /* ══ 特效引擎 ══ */
    var fxTimers=[];
    function fxClear(){
      fxTimers.forEach(clearTimeout); fxTimers=[];
      // 重置所有特效
      document.getElementById('fx-vignette').className='';
      document.getElementById('fx-particles').innerHTML='';
      document.getElementById('fx-weather').innerHTML='';
      var halo=document.getElementById('fx-halo');
      halo.className=''; halo.style.cssText='';
      document.getElementById('fx-spotlight').className='';
      var sc=document.getElementById('fx-scan');
      sc.className=''; void sc.offsetWidth;
      var gl=document.getElementById('fx-glitch');
      gl.className=''; void gl.offsetWidth;
      var r1=document.getElementById('fx-ripple');
      r1.className=''; r1.style.cssText='';
      var r2=document.getElementById('fx-ripple2');
      r2.className=''; r2.style.cssText='';
      var r3=document.getElementById('fx-ripple3');
      r3.className=''; r3.style.cssText='';
    }

    function fxAt(ms, fn){
      fxTimers.push(setTimeout(fn, ms));
    }

    /* M 暗角呼吸 */
    function fxM(){
      document.getElementById('fx-vignette').classList.add('breathe');
    }

    /* F 鏡頭震動 */
    function fxF(){
      var cs=document.getElementById('intro-cs');
      cs.classList.remove('shake'); void cs.offsetWidth;
      cs.classList.add('shake');
    }

    /* A 粒子（color: 'gold'|'blue'|'warm'） */
    function fxA(color){
      var el=document.getElementById('fx-particles');
      el.innerHTML='';
      var colors={
        gold:  ['rgba(255,220,80,.9)','rgba(255,180,40,.8)','rgba(255,255,150,.7)'],
        blue:  ['rgba(100,200,255,.9)','rgba(150,230,255,.8)','rgba(80,170,255,.7)'],
        warm:  ['rgba(255,160,60,.9)', 'rgba(255,200,80,.8)','rgba(255,120,40,.7)']
      };
      var cl=colors[color]||colors.blue;
      for(var i=0;i<28;i++){
        var p=document.createElement('div');
        p.className='fx-p';
        var sz=(Math.random()*4+2)+'px';
        var px=Math.random()*100;
        var py=-(80+Math.random()*140);
        var pd=(2.5+Math.random()*2.5).toFixed(1)+'s';
        var dl=(Math.random()*1.5).toFixed(2)+'s';
        p.style.cssText='width:'+sz+';height:'+sz+
          ';left:'+px+'%;bottom:'+(5+Math.random()*30)+'%;'+
          'background:'+cl[Math.floor(Math.random()*cl.length)]+';'+
          '--py:'+py+'px;--pd:'+pd+';--delay:'+dl+';'+
          'box-shadow:0 0 4px '+cl[0]+';';
        el.appendChild(p);
      }
    }

    /* B 光暈脈衝（cx,cy 為百分比位置） */
    function fxB(cx,cy){
      var h=document.getElementById('fx-halo');
      var sw=document.getElementById('intro-screen').offsetWidth;
      var sh=document.getElementById('intro-screen').offsetHeight;
      var sz=Math.min(sw,sh)*0.7;
      h.style.cssText='width:'+sz+'px;height:'+sz+'px;'+
        'left:'+(sw*cx/100-sz/2)+'px;top:'+(sh*cy/100-sz/2)+'px;';
      h.classList.add('pulse');
    }

    /* E 掃描線 */
    function fxE(){
      var s=document.getElementById('fx-scan');
      s.classList.remove('sweep'); void s.offsetWidth;
      s.classList.add('sweep');
    }

    /* G 色彩偏移 */
    function fxG(){
      var g=document.getElementById('fx-glitch');
      g.classList.remove('go'); void g.offsetWidth;
      g.classList.add('go');
    }

    /* H 聚光燈 */
    function fxH(){
      document.getElementById('fx-spotlight').classList.add('on');
    }

    /* I 漣漪（cx,cy 百分比） */
    function fxI(cx,cy){
      var scr=document.getElementById('intro-screen');
      var sw=scr.offsetWidth, sh=scr.offsetHeight;
      var sz=Math.min(sw,sh)*0.85;
      var lf=(sw*cx/100-sz/2)+'px';
      var tp=(sh*cy/100-sz/2)+'px';
      var base='width:'+sz+'px;height:'+sz+'px;left:'+lf+';top:'+tp+';';
      var r1=document.getElementById('fx-ripple');
      var r2=document.getElementById('fx-ripple2');
      var r3=document.getElementById('fx-ripple3');
      r1.style.cssText=base; r1.classList.remove('go'); void r1.offsetWidth; r1.classList.add('go');
      r2.style.cssText=base; r2.classList.remove('go'); void r2.offsetWidth; r2.classList.add('go');
      r3.style.cssText=base; r3.classList.remove('go'); void r3.offsetWidth; r3.classList.add('go');
    }

    /* K 天氣粒子（橙紅塵埃） */
    function fxK(){
      var el=document.getElementById('fx-weather');
      el.innerHTML='';
      for(var i=0;i<22;i++){
        var p=document.createElement('div');
        p.className='fx-w';
        var sz=(Math.random()*3+1.5)+'px';
        var lf=(Math.random()*100)+'%';
        var wd=(5+Math.random()*4).toFixed(1)+'s';
        var dl=(Math.random()*2).toFixed(2)+'s';
        var wx=((Math.random()-0.5)*60).toFixed(0)+'px';
        var col=Math.random()>.5?'rgba(255,160,60,.8)':'rgba(255,210,80,.7)';
        p.style.cssText='width:'+sz+';height:'+sz+';left:'+lf+
          ';background:'+col+';--wd:'+wd+';--wdelay:'+dl+';--wx:'+wx+';'+
          'box-shadow:0 0 3px rgba(255,150,30,.6);';
        el.appendChild(p);
      }
    }

    /* ══ 每頁特效排程表 ══ */
    var PAGE_FX = [
      // P1: 6s M, 9s F
      function(){ fxAt(6000,fxM); fxAt(9000,fxF); },
      // P2: 6s A(gold)+B
      function(){ fxAt(6000,function(){ fxA('gold'); fxB(50,30); }); },
      // P3: 8s E, 9s G
      function(){ fxAt(8000,fxE); fxAt(9000,fxG); },
      // P4: 8s I, 9s A(blue)
      function(){ fxAt(8000,function(){ fxI(50,65); }); fxAt(9000,function(){ fxA('blue'); }); },
      // P5: 7s F, 9s B
      function(){ fxAt(7000,fxF); fxAt(9000,function(){ fxB(50,45); }); },
      // P6: 8s H, 10s M
      function(){ fxAt(8000,fxH); fxAt(10000,fxM); },
      // P7: 7s G, 9s F
      function(){ fxAt(7000,fxG); fxAt(9000,fxF); },
      // P8: 6s A(blue), 8s I
      function(){ fxAt(6000,function(){ fxA('blue'); }); fxAt(8000,function(){ fxI(50,50); }); },
      // P9: 6s K, 9s A(warm)
      function(){ fxAt(6000,fxK); fxAt(9000,function(){ fxA('warm'); }); }
    ];

    function showImg(n){
      if(!alive)return;
      fxClear(); // 清除上一頁特效
      document.getElementById('intro-pgnum').textContent='● '+(n+1)+' / '+IMGS.length;
      var inc=slotA?imgA:imgB;
      var out=slotA?imgB:imgA;

      /* 黑幕緩升 */
      blkOvl.style.opacity='1';

      /* 掃光重置 */
      scanEl.classList.remove('sweep');
      void scanEl.offsetWidth;

      inc.src=IMGS[n];
      inc.classList.remove('breath');
      inc.removeAttribute('style');
      inc.style.opacity='0';
      inc.style.transform='scale(1.06)';
      inc.style.transition='opacity 0s';

      setTimeout(function(){
        /* 黑幕緩降 */
        blkOvl.style.opacity='0';

        /* 新圖淡入 */
        inc.style.transition='opacity '+FADE_IN+'ms cubic-bezier(.4,0,.2,1)';
        inc.style.opacity='1';

        /* 6秒出場動畫 */
        inc.style.setProperty('--breath-dur', BREATH_DUR+'ms');
        void inc.offsetWidth;
        inc.classList.add('breath');

        /* 舊圖淡出 */
        out.style.transition='opacity '+FADE_OUT+'ms ease';
        out.style.opacity='0';
        slotA=!slotA;

        /* 觸發該頁特效排程 */
        if(PAGE_FX[n]) PAGE_FX[n]();

        /* 掃光：圖淡入後0.3s觸發 */
        setTimeout(function(){
          scanEl.classList.add('sweep');
        },300);

        /* 閃光特效：進場時輕閃 */
        flashEl.classList.remove('pop');
        void flashEl.offsetWidth;
        flashEl.classList.add('pop');

        /* 下一張 or 結束 */
        if(n<IMGS.length-1){
          setTimeout(function(){ if(alive)showImg(n+1); }, STAY);
        } else {
          setTimeout(function(){
            if(!alive)return;
            fadeVol(0.5,2000);
            endIntro(false);
          }, STAY);
        }
      }, FADE_OUT+BLACK);
    }

    function endIntro(fast){
      alive=false;
      if(fast){ fadeVol(0.5,600); }
      var scr=document.getElementById('intro-screen');
      scr.classList.add('closing');
      setTimeout(function(){
        scr.remove();
        var w=document.getElementById('welcome-screen');
        if(w){
          w.style.display='flex';
          w.style.opacity='0';
          w.style.transition='opacity .85s ease';
          setTimeout(function(){ w.style.opacity='1'; },30);
        }
      }, fast?700:1500);
    }

    window.introSkip=function(){
      if(!alive)return;
      alive=false;
      introScr.removeEventListener('click',startComic);
      endIntro(true);
    };
  })();
  }
  </script>

	<script>
	/* ══ 歡迎頁邏輯 ══════════════════════════════════════ */
	(function(){

		/* 泡泡 */
		var _bubTimer = null;
		function _mkBub(){
			var wrap = document.getElementById('ws-bubbles');
			if(!wrap) return;
			var b = document.createElement('div');
			b.className = 'ws-mbubble';
			var s = 5 + Math.random()*12;
			b.style.cssText =
				'width:'+s+'px;height:'+s+'px;' +
				'left:'+(Math.random()*88+5)+'%;' +
				'bottom:-'+s+'px;' +
				'animation-duration:'+(8+Math.random()*10)+'s;' +
				'animation-delay:'+(Math.random()*4)+'s;';
			wrap.appendChild(b);
			setTimeout(function(){ b.remove(); }, 22000);
		}
		function _startBub(){
			if(_bubTimer) return;
			for(var i=0;i<8;i++) _mkBub();
			_bubTimer = setInterval(_mkBub, 1800);
		}
		function _stopBub(){
			if(_bubTimer){ clearInterval(_bubTimer); _bubTimer=null; }
		}

		/* 監聽 welcome-screen display 變化，自動啟停泡泡 */
		var _wsEl = document.getElementById('welcome-screen');
		if(_wsEl){
			new MutationObserver(function(){
				if(_wsEl.style.display !== 'none'){ _startBub(); }
				else { _stopBub(); }
			}).observe(_wsEl, { attributes:true, attributeFilter:['style'] });
		}

		/* 難度 */
		window.wsSetDiff = function(val, btn){
			if(typeof gameDifficulty !== 'undefined') gameDifficulty = val;
			document.querySelectorAll('.ws-diff-btn')
				.forEach(function(b){ b.classList.remove('ws-active'); });
			btn.classList.add('ws-active');
		};

		/* 音效・音樂開關 */
		window.wsToggleSound = function(){
			var toggle = document.getElementById('ws-sound-toggle');
			var icon   = document.getElementById('ws-sound-icon');
			var isOn   = toggle.classList.toggle('ws-on');
			if(typeof sfxEnabled !== 'undefined') sfxEnabled = isOn;
			sessionStorage.setItem('sfxEnabled', isOn ? 'true' : 'false');
			icon.textContent = isOn ? '🔊' : '🔇';
			var bgm = document.getElementById('bgm');
			if(bgm){
				if(isOn){ bgm.play().catch(function(){}); }
				else    { bgm.pause(); }
			}
		};
		/* 初始化：讀取 sessionStorage */
		(function(){
			var stored = sessionStorage.getItem('sfxEnabled');
			if(stored === 'false'){
				if(typeof sfxEnabled !== 'undefined') sfxEnabled = false;
				var t = document.getElementById('ws-sound-toggle');
				var i = document.getElementById('ws-sound-icon');
				if(t) t.classList.remove('ws-on');
				if(i) i.textContent = '🔇';
			}
		})();

		/* 啟航冒險 */
		window.wsStartGame = function(){
			var nameEl = document.getElementById('ws-name-input');
			window.playerName = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : '勇者';
			_stopBub();
			if(typeof initGame === 'function') initGame();
		};

	})();
	</script>
