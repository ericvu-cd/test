<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- LINE 瀏覽器重導向 -->
    <script>
        (function() {
            var ua = navigator.userAgent;
            if (ua.indexOf("Line") > -1) {
                var url = window.location.href;
                if (url.indexOf('openExternalBrowser=1') === -1) {
                    var separator = url.indexOf('?') === -1 ? '?' : '&';
                    window.location.replace(url + separator + 'openExternalBrowser=1');
                }
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友魚勇者之路-單人版</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="welcome.css">
</head>
<body>

  <!-- ══ 開場畫面 ══ -->
  <div id="intro-screen">
    <div id="intro-vig"></div>
    <div id="intro-blk"></div>
    <div id="intro-scan"></div>
    <div id="intro-flash"></div>
    <div id="fx-vignette"></div>
    <div id="fx-particles"></div>
    <div id="fx-weather"></div>
    <div id="fx-halo"></div>
    <div id="fx-spotlight"></div>
    <div id="fx-scan"></div>
    <div id="fx-glitch"></div>
    <div id="fx-ripple"></div>
    <div id="fx-ripple2"></div>
    <div id="fx-ripple3"></div>
    <div id="intro-ts">
      <div id="intro-title"></div>
      <div id="intro-hint">點擊畫面開場</div>
    </div>
    <div id="intro-cs">
      <img id="iimg-a" class="iimg" src="" alt="">
      <img id="iimg-b" class="iimg" src="" alt="">
      <div id="intro-pgnum"></div>
    </div>
    <div id="intro-credits">Presented by Eric</div>
    <button id="intro-skip" onclick="introSkip()">不要跳過</button>
  </div>

  <!-- ══ 歡迎頁 ══ -->
  <div id="welcome-screen" style="display:none;">
    <div id="ws-rays">
      <div class="ws-ray"></div>
      <div class="ws-ray"></div>
      <div class="ws-ray"></div>
      <div class="ws-ray"></div>
    </div>
    <div id="ws-vignette"></div>
    <div id="ws-bubbles"></div>

    <div class="ws-container">
      <div class="ws-title-block">
        <div class="ws-subtitle">準備開始</div>
      </div>

      <div class="ws-card">
        <div>
          <div class="ws-field-label">勇者暱稱</div>
          <input class="ws-name-input" id="ws-name-input" type="text" placeholder="輸入你的暱稱…" maxlength="12">
        </div>
        <div>
          <div class="ws-field-label">難度選擇</div>
          <div class="ws-diff-row">
            <button class="ws-diff-btn ws-active" onclick="wsSetDiff(0.4,this)">🐚 新手</button>
            <button class="ws-diff-btn"           onclick="wsSetDiff(0.7,this)">🐠 標準</button>
            <button class="ws-diff-btn"           onclick="wsSetDiff(0.9,this)">🦈 專業</button>
          </div>
        </div>
        <div class="ws-sound-wrap">
          <span class="ws-sound-label"><span id="ws-sound-icon">🔊</span>音效・音樂</span>
          <div class="ws-toggle ws-on" id="ws-sound-toggle" onclick="wsToggleSound()"></div>
        </div>
        <div class="ws-sound-wrap">
          <span class="ws-sound-label"><span id="ws-report-icon">📊</span>結算報告</span>
          <div class="ws-toggle ws-on" id="ws-report-toggle" onclick="wsToggleReport()"></div>
        </div>
      </div>

      <div style="width:100%;display:flex;flex-direction:column;gap:10px;">
        <button id="ws-start-btn" onclick="wsStartGame()">⚓ 啟航冒險</button>
        <div class="ws-sub-row">
          <button class="ws-sub-btn" onclick="openInfo()">簡介說明</button>
          <button class="ws-sub-btn" onclick="startTutorial()">新手教學</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 開場跳過邏輯：必須在 #intro-screen 與 #welcome-screen 都出現在 DOM 後才執行 -->
  <script>
  if (sessionStorage.getItem('skipIntro') === '1') {
    sessionStorage.removeItem('skipIntro');
    var _i = document.getElementById('intro-screen');
    if (_i) _i.remove();
    var _w = document.getElementById('welcome-screen');
    if (_w) { _w.style.display = 'flex'; _w.style.animation = 'welcomeFadeIn 1.5s ease-in-out forwards'; }
  }
  </script>

  <!-- ══ 音訊 ══ -->
  <audio id="bgm" loop preload="auto">
    <source src="Below_the_Surface.mp3" type="audio/mpeg">
  </audio>

  <!-- ══ 懸浮控制鈕 ══ -->
  <div id="music-control"  onclick="toggleMusic()"       style="position:fixed;top:10px;left:10px;z-index:2000;width:40px;height:40px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.2);border-radius:50%;display:none;justify-content:center;align-items:center;font-size:20px;cursor:pointer;backdrop-filter:blur(4px);">🎵</div>
  <div id="report-control" onclick="toggleReportMode()"  style="position:fixed;top:10px;right:10px;z-index:2000;width:40px;height:40px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.2);border-radius:50%;display:none;justify-content:center;align-items:center;font-size:20px;cursor:pointer;backdrop-filter:blur(4px);">📊</div>

  <!-- ══ 日誌彈窗 ══ -->
  <div id="log-modal">
    <div id="log-content">
      <div class="log-header">
        <span>出牌紀錄</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="log-copy-btn" onclick="copyLog()">📋 複製</button>
          <button onclick="closeLog()">關閉</button>
        </div>
      </div>
      <div id="log-messages"></div>
    </div>
  </div>

  <!-- ══ 故事 Overlay ══ -->
  <div id="story-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:3000;">
    <img id="story-img" src="" style="width:100%;height:100%;object-fit:cover;">
    <div style="position:absolute;top:20px;right:20px;width:100%;display:flex;justify-content:right;gap:20px;">
      <button class="ctrl-btn" onclick="closeStory()">X</button>
    </div>
    <div id="story-page-num" style="position:absolute;top:20px;left:20px;color:white;background:rgba(0,0,0,0.2);padding:5px 10px;border-radius:20px;">1 / 6</div>
  </div>

  <!-- ══ 說明 Overlay ══ -->
  <div id="info-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;z-index:3000;">
    <img id="info-img" src="" style="width:100%;height:100%;object-fit:cover;">
    <div style="position:absolute;top:20px;right:20px;width:100%;display:flex;justify-content:right;gap:20px;">
      <button class="ctrl-btn" onclick="closeInfo()">X</button>
    </div>
    <div id="info-page-num" style="position:absolute;top:20px;left:20px;color:white;background:rgba(0,0,0,0.2);padding:5px 10px;border-radius:20px;">1 / 18</div>
  </div>

  <!-- ══ 卡片放大預覽 ══ -->
  <div id="card-preview-overlay">
    <div id="card-preview-container"></div>
  </div>

  <!-- ══ 遊戲主畫面 ══ -->
  <div id="header">友魚勇者之路單人挑戰</div>

  <div class="char-area">
    <div id="ai-1" class="box"></div>
    <div id="ai-2" class="box"></div>
    <div id="ai-3" class="box"></div>
  </div>

  <div id="ocean">
    <div id="fish-layer"></div>
    <div id="bubbles"></div>
    <div id="deck-info">剩餘召喚卡: --</div>
    <div id="log-btn" onclick="openLog()">📜出牌記錄</div>
    <div id="summon-display"></div>
    <div id="table"></div>
  </div>

  <div id="player-zone" style="position:relative;overflow:hidden;">
    <div id="drawer-up-arrow" style="display:none;">▲ 上滑/左滑/右滑選牌</div>
    <div id="arrow-left"  class="hand-arrow"></div>
    <div id="player-hand" class="hand"></div>
    <div id="arrow-right" class="hand-arrow"></div>
  </div>

  <!-- ══ 輔助層 ══ -->
  <div id="chat-layer"></div>
  <div id="tutorial-tooltip"></div>
  <div id="ui-lock"></div>
  <div id="summon-focus-overlay">
    <div id="summon-focus-box">🔍 尋找勇者...<br>等待中...</div>
  </div>

  <!-- 停用右鍵選單 -->
  <script>document.addEventListener('contextmenu', e => e.preventDefault());</script>

  <!-- ══ 模組載入順序 ══════════════════════════════
       1. sfx.js       — 音效系統（無依賴）
       2. db.js        — 資料庫（無依賴）
       3. state.js     — 全域狀態與工具函式
       4. ui.js        — UI 渲染（依賴 state）
       5. ocean.js     — 海洋動畫（依賴 state）
       6. drawer.js    — 手牌抽屜（依賴 state, ui）
       7. animation.js — 動畫特效（依賴 state, ui）
       8. game.js      — 遊戲核心（依賴上述全部）
       9. tutorial.js  — 教學模式（依賴 game）
      10. win-screen.js— 勝利畫面（依賴 game）
      11. welcome.js   — 歡迎頁邏輯（依賴 game）
      12. intro.js     — 開場動畫（最後載入）
  ════════════════════════════════════════════ -->
  <script src="sfx.js"></script>
  <script src="db.js"></script>
  <script src="state.js"></script>
  <script src="ui.js"></script>
  <script src="ocean.js"></script>
  <script src="drawer.js"></script>
  <script src="animation.js"></script>
  <script src="game.js"></script>
  <script src="tutorial.js"></script>
  <script src="win-screen.js"></script>
  <script src="welcome.js"></script>
  <script src="intro.js"></script>

</body>
</html>
