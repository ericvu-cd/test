<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
	<script>
        (function() {
            var ua = navigator.userAgent;
            if (ua.indexOf("Line") > -1) {
                var url = window.location.href;
                if (url.indexOf('openExternalBrowser=1') === -1) {
                    var separator = url.indexOf('?') === -1 ? '?' : '&';
                    window.location.replace(url + separator + 'openExternalBrowser=1');
                }
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海紋守護團：台灣海線任務</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">

	<style>
		body { background: #000; transition: background 0.8s ease; }
		body.game-started { background: transparent; }
	</style>

    <!-- ══ 歡迎頁樣式 ══ -->
    <style>
    /* ── 歡迎頁根容器 ── */
    #welcome-screen {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 1000;
        overflow: hidden;
        opacity: 0;
        animation: welcomeFadeIn 1.5s ease-in-out forwards;
        transition: opacity 1.2s ease-in-out, visibility 1.2s;
        font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    @keyframes welcomeFadeIn { from{opacity:0} to{opacity:1} }
    #welcome-screen.fade-out { opacity:0; visibility:hidden; }
    #welcome-screen.hidden   { opacity:0; visibility:hidden; pointer-events:none; }

    /* ── 背景地圖（tw.png 鋪滿，object-fit:cover） ── */
    #ws-map-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
    }
    #ws-map-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
    }

    /* ── 頂部列 ── */
    #ws-topbar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 52px;
        padding: env(safe-area-inset-top, 0px) 14px 0;
        background: rgba(3, 12, 26, 0.82);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 50;
        border-bottom: 1px solid rgba(80,160,220,0.12);
    }
    #ws-top-title {
        display: flex;
        align-items: center;
    }
    #ws-title-text {
        font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
        font-size: clamp(.95rem, 3.5vw, 1.15rem);
        font-weight: 900;
        color: #e0f0ff;
        letter-spacing: .18em;
        text-shadow: 0 0 12px rgba(80,180,255,0.65);
    }

    /* ── 海浪 canvas ── */
    #ws-waves {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    /* ── intro subtitle.png：絕對定位，JS 設座標 ── */
    #intro-subtitle {
        position: absolute;
        z-index: 6;
        height: 36px;
        width: auto;
        opacity: 0;
        pointer-events: none;
        transition: opacity .8s ease;
        filter: drop-shadow(0 0 8px rgba(100,200,255,0.4));
    }
    #intro-subtitle.show { opacity: 1; }
    /* intro-ts 整體上移，視覺重心往上 */
    #intro-ts {
        justify-content: flex-start !important;
        padding-top: 32vh !important;
    }
    #ws-top-icons {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    .ws-icon-btn {
        width: 36px; height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(80,160,220,0.3);
        background: rgba(8,22,45,0.75);
        display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem;
        cursor: pointer;
        transition: background .18s, transform .12s;
        position: relative;
        -webkit-tap-highlight-color: transparent;
    }
    .ws-icon-btn:active { transform: scale(0.92); }
    .ws-icon-btn.ws-off { opacity: 0.45; }

    /* ── Toast 提示 ── */
    #ws-toast {
        position: absolute;
        top: 58px; right: 12px;
        background: rgba(8,22,45,0.95);
        border: 1px solid rgba(80,160,220,0.35);
        border-radius: 10px;
        padding: 7px 13px;
        font-size: .82rem;
        color: #d0eaff;
        z-index: 200;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity .22s, transform .22s;
        white-space: nowrap;
    }
    #ws-toast.show {
        opacity: 1;
        transform: translateY(0);
    }

    /* ── 港口容器（鋪滿全螢幕，與 welcome-screen 同層） ── */
    #ws-harbor-layer {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 10;
        pointer-events: none;
    }

    /* ── 港口氣泡 ── */
    .ws-harbor {
        position: absolute;
        transform: translate(-50%, -50%);
        cursor: pointer;
        pointer-events: all;
        z-index: 12;
    }
    .ws-harbor .ws-h-core {
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #7fd9ff;
        border: 1.5px solid rgba(255,255,255,0.55);
        margin: auto;
        transition: background .22s, transform .22s;
        animation: wsHarborPulse 2.8s ease-in-out infinite;
    }
    @keyframes wsHarborPulse {
        0%,100% { transform: scale(1); }
        50%      { transform: scale(1.18); }
    }
    .ws-harbor .ws-h-ring {
        position: absolute;
        top: 50%; left: 50%;
        width: 26px; height: 26px;
        border-radius: 50%;
        border: 1.5px solid rgba(127,217,255,0.4);
        transform: translate(-50%, -50%);
        animation: wsRingPulse 2.8s ease-in-out infinite;
        pointer-events: none;
    }
    @keyframes wsRingPulse {
        0%   { transform: translate(-50%,-50%) scale(.7); opacity:.7; }
        100% { transform: translate(-50%,-50%) scale(1.6); opacity:0; }
    }
    .ws-harbor .ws-h-label {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: .94rem;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 1px 5px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.8);
        pointer-events: none;
    }
    /* 西岸漁港標籤往右顯示，避免被邊緣切到 */
    .ws-harbor.label-right .ws-h-label {
        left: 14px;
        transform: none;
    }
    /* 選中狀態 */
    .ws-harbor.ws-selected .ws-h-core {
        background: #ffd86b;
        border-color: #fff;
        box-shadow: 0 0 0 3px rgba(255,216,107,0.35);
        animation: none;
        transform: scale(1.2);
    }
    .ws-harbor.ws-selected .ws-h-ring {
        border-color: rgba(255,216,107,0.6);
        animation: wsRingPulseGold 1.8s ease-in-out infinite;
    }
    @keyframes wsRingPulseGold {
        0%   { transform: translate(-50%,-50%) scale(.8); opacity:.8; }
        100% { transform: translate(-50%,-50%) scale(1.8); opacity:0; }
    }
    .ws-harbor.ws-selected .ws-h-label {
        color: #ffd86b;
        text-shadow: 0 1px 5px rgba(0,0,0,0.95), 0 0 12px rgba(255,216,107,0.5);
    }

    /* ── 小船 ── */
    #ws-boat {
        position: absolute;
        font-size: 1.5rem;
        transform: translate(-50%, -50%);
        transition: left 1.13s cubic-bezier(.2,.85,.2,1),
                    top  1.13s cubic-bezier(.2,.85,.2,1);
        z-index: 11;
        pointer-events: none;
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
        animation: wsBoatFloat 2.8s ease-in-out infinite;
    }
    @keyframes wsBoatFloat {
        0%,100% { margin-top: 0; }
        50%      { margin-top: -3px; }
    }

    /* ── 右下角面板 ── */
    #ws-panel {
        position: absolute;
        right: 12px;
        bottom: 36px; /* 版權列高度上方 */
        width: 162px;
        background: rgba(4, 14, 30, 0.8);
        border: 1px solid rgba(60,140,200,0.25);
        border-radius: 16px;
        padding: 12px;
        z-index: 30;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    #ws-panel-hint {
        text-align: center;
        color: rgba(100,170,210,0.75);
        font-size: .82rem;
        line-height: 1.5;
        padding: 12px 4px;
    }
    #ws-panel-harbor-info {
        display: none;
    }
    #ws-panel-harbor-name {
        font-size: .92rem;
        font-weight: 700;
        color: #e8f4ff;
        margin-bottom: 1px;
        text-shadow: 0 0 10px rgba(80,180,255,0.5);
    }
    #ws-panel-badge {
        font-size: .72rem;
        color: #f5c842;
        margin-bottom: 9px;
    }
    .ws-panel-label {
        font-size: .68rem;
        letter-spacing: .1em;
        color: rgba(100,170,210,0.7);
        margin-bottom: 4px;
    }
    #ws-name-input {
        width: 100%;
        box-sizing: border-box;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(60,140,200,0.3);
        border-radius: 8px;
        padding: 7px 9px;
        color: #e8f4ff;
        font-size: .85rem;
        font-family: "Microsoft JhengHei", sans-serif;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
        transition: border-color .2s;
    }
    #ws-name-input::placeholder { color: rgba(120,180,220,0.4); }
    #ws-name-input:focus { border-color: rgba(100,200,255,0.6); }

    .ws-diff-row { display: flex; gap: 4px; margin-bottom: 10px; }
    .ws-diff-btn {
        flex: 1;
        padding: 6px 0;
        border-radius: 7px;
        border: 1px solid rgba(60,140,200,0.25);
        background: rgba(255,255,255,0.05);
        color: rgba(160,210,240,0.8);
        font-size: .825rem;
        cursor: pointer;
        transition: all .18s;
        font-family: "Microsoft JhengHei", sans-serif;
        -webkit-tap-highlight-color: transparent;
        text-align: center;
    }

    /* ── 左上角：守護員暱稱輸入框 ── */
    #ws-name-box {
        position: absolute;
        left: 12px;
        top: 64px; /* 頂部列高度下方 */
        width: 150px;
        background: rgba(4,14,30,0.8);
        border: 1px solid rgba(60,140,200,0.25);
        border-radius: 14px;
        padding: 10px 12px;
        z-index: 30;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    #ws-name-box .ws-panel-label { margin-bottom: 6px; }

    /* ── 天氣海象卡片（暱稱框下方） ── */
    #ws-weather-box {
        position: absolute;
        left: 12px;
        top: 142px; /* 暱稱框下方 */
        max-width: 220px;
        width: max-content;
        background: rgba(4,14,30,0.8);
        border: 1px solid rgba(60,140,200,0.25);
        border-radius: 14px;
        padding: 8px 14px;
        z-index: 30;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity .5s ease, transform .5s ease;
    }
    #ws-weather-box.show { opacity: 1; transform: translateY(0); }
    #ws-weather-name {
        font-size: .88rem;
        font-weight: 700;
        color: #e8f4ff;
        white-space: nowrap;
        line-height: 1.4;
    }
    #ws-event-name {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid rgba(60,140,200,0.2);
        font-size: .82rem;
        font-weight: 700;
        color: #ffb347;
        white-space: nowrap;
        display: none;
    }
    #ws-event-name.show { display: block; }

    /* ── 港口關閉狀態 ──
       filter 只套用在核心圓點上，不影響文字標籤的可讀性 */
    .ws-harbor.ws-closed {
        pointer-events: none;
    }
    .ws-harbor.ws-closed .ws-h-core {
        background: #888;
        animation: none;
        opacity: .6;
        filter: grayscale(1);
    }
    .ws-harbor.ws-closed .ws-h-ring { display: none; }
    .ws-harbor.ws-closed .ws-h-label {
        color: rgba(220,220,220,0.85);
    }
    .ws-harbor .ws-h-lock {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: .9rem;
        display: none;
        filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
        z-index: 2;
    }
    .ws-harbor.ws-closed .ws-h-lock { display: block; }
    .ws-harbor .ws-h-event-tag {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: .62rem;
        color: #ffb347;
        text-shadow: 0 1px 4px rgba(0,0,0,0.95);
        display: none;
    }
    .ws-harbor.ws-closed .ws-h-event-tag.show { display: block; }
    .ws-diff-btn:active { transform: scale(0.94); }
    .ws-diff-btn.ws-active {
        background: rgba(255,183,77,0.15);
        border-color: rgba(255,200,100,0.55);
        color: #ffe89e;
        font-weight: 700;
    }

    #ws-start-btn {
        width: 100%;
        padding: 9px 0;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #1a7abf, #0d5a94);
        color: #fff;
        font-size: .95rem;
        font-weight: 700;
        letter-spacing: .08em;
        cursor: pointer;
        font-family: "Microsoft JhengHei", sans-serif;
        transition: transform .12s, opacity .12s;
        -webkit-tap-highlight-color: transparent;
        position: relative;
        overflow: hidden;
    }
    #ws-start-btn::after {
        content: '';
        position: absolute;
        top: -50%; left: -70%;
        width: 40%; height: 200%;
        background: rgba(255,255,255,0.12);
        transform: rotate(28deg);
        animation: wsBtnShimmer 3s ease-in-out infinite;
    }
    @keyframes wsBtnShimmer { 0%,60%{left:-70%} 80%{left:130%} 100%{left:130%} }
    #ws-start-btn:active { transform: scale(0.96); opacity: .92; }

    /* ── 左下角：簡介 + 教學 ── */
    #ws-bottom-left {
        position: absolute;
        left: 12px;
        bottom: 36px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 30;
    }
    .ws-sub-btn {
        padding: 7px 13px;
        border-radius: 14px;
        border: 1px solid rgba(100,180,220,0.28);
        background: rgba(4,14,30,0.82);
        color: rgba(160,215,245,0.85);
        font-size: .88rem;
        font-weight: 700;
        cursor: pointer;
        font-family: "Microsoft JhengHei", sans-serif;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: all .18s;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
    }
    .ws-sub-btn:active { transform: scale(0.95); background: rgba(10,30,58,0.9); }

    /* ── 版權列（永遠最底，不被遮蓋） ── */
    #ws-copyright {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 30px;
        background: rgba(2, 8, 18, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
        border-top: 1px solid rgba(40,100,160,0.15);
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #ws-copyright span {
        font-size: .84rem;
        color: rgba(160,210,240,0.75);
        letter-spacing: .04em;
    }
    #ws-copyright a {
        color: rgba(160,210,240,0.9);
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-color: rgba(160,210,240,0.4);
    }

    /* ── 結算報告關閉時的紅X覆蓋層 ── */
    #ws-rpt-btn .ws-rpt-x {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: 900;
        color: #ff3333;
        pointer-events: none;
        line-height: 1;
    }
    </style>
</head>
<body>

  <!-- ══ 開場畫面 ══ -->
  <div id="intro-screen">
    <div id="intro-vig"></div>
    <div id="intro-blk"></div>
    <div id="intro-scan"></div>
    <div id="intro-flash"></div>

    <!-- 特效層 -->
    <div id="fx-vignette"></div>
    <div id="fx-particles"></div>
    <div id="fx-weather"></div>
    <div id="fx-halo"></div>
    <div id="fx-spotlight"></div>
    <div id="fx-scan"></div>
    <div id="fx-glitch"></div>
    <div id="fx-ripple"></div>
    <div id="fx-ripple2"></div>
    <div id="fx-ripple3"></div>

    <div id="intro-ts">
      <div id="intro-title"></div>
      <div id="intro-hint">點擊畫面開場</div>
    </div>
    <img src="image/subtitle.png" id="intro-subtitle" alt="台灣海線任務">

    <div id="intro-cs">
      <img id="iimg-a" class="iimg" src="" alt="">
      <img id="iimg-b" class="iimg" src="" alt="">
      <div id="intro-pgnum"></div>
    </div>

	<div id="intro-credits" style="opacity:0">Presented by Eric</div>
    <button id="intro-skip" onclick="introSkip()" style="display:none">不要跳過 >></button>
  </div>

  <!-- ══ 開場邏輯 ══ -->

	<div id="welcome-screen" style="display:none;">

		<!-- ── 背景：台灣地圖 ── -->
		<div id="ws-map-bg">
			<img src="image/tw.png" alt="台灣地圖" draggable="false">
		</div>

		<!-- ── 海浪動畫層 ── -->
		<canvas id="ws-waves"></canvas>

		<!-- ── 頂部列 ── -->
		<div id="ws-topbar">
			<div id="ws-top-title">
				<div id="ws-title-text">台灣海線任務</div>
			</div>
			<div id="ws-top-icons">
				<div class="ws-icon-btn" id="ws-sfx-btn" onclick="wsToggleSound()" title="音效・音樂">🔊</div>
				<div class="ws-icon-btn" id="ws-rpt-btn" onclick="wsToggleReport()" title="結算報告">📊</div>
			</div>
		</div>

		<!-- ── Toast 提示 ── -->
		<div id="ws-toast"></div>

		<!-- ── 港口氣泡層（JS 定位） ── -->
		<div id="ws-harbor-layer">
			<!-- 基隆八斗子：東北角海岸 -->
			<div class="ws-harbor" id="wsh-badouzi" data-id="badouzi" onclick="wsSelectHarbor('badouzi')">
				<div class="ws-h-lock">🔒</div>
				<div class="ws-h-ring"></div>
				<div class="ws-h-core"></div>
				<div class="ws-h-label">八斗子</div>
				<div class="ws-h-event-tag"></div>
			</div>
			<!-- 宜蘭南方澳：東岸中上 -->
			<div class="ws-harbor" id="wsh-nanfangao" data-id="nanfangao" onclick="wsSelectHarbor('nanfangao')">
				<div class="ws-h-lock">🔒</div>
				<div class="ws-h-ring"></div>
				<div class="ws-h-core"></div>
				<div class="ws-h-label">南方澳</div>
				<div class="ws-h-event-tag"></div>
			</div>
			<!-- 苗栗龍鳳：西岸中上 -->
			<div class="ws-harbor label-right" id="wsh-longfeng" data-id="longfeng" onclick="wsSelectHarbor('longfeng')">
				<div class="ws-h-lock">🔒</div>
				<div class="ws-h-ring"></div>
				<div class="ws-h-core"></div>
				<div class="ws-h-label">龍鳳</div>
				<div class="ws-h-event-tag"></div>
			</div>
			<!-- 台中梧棲：西岸中段 -->
			<div class="ws-harbor label-right" id="wsh-wuqi" data-id="wuqi" onclick="wsSelectHarbor('wuqi')">
				<div class="ws-h-lock">🔒</div>
				<div class="ws-h-ring"></div>
				<div class="ws-h-core"></div>
				<div class="ws-h-label">梧棲</div>
				<div class="ws-h-event-tag"></div>
			</div>
			<!-- 台南安平：西南岸 -->
			<div class="ws-harbor label-right" id="wsh-anping" data-id="anping" onclick="wsSelectHarbor('anping')">
				<div class="ws-h-lock">🔒</div>
				<div class="ws-h-ring"></div>
				<div class="ws-h-core"></div>
				<div class="ws-h-label">安平</div>
				<div class="ws-h-event-tag"></div>
			</div>
			<!-- 屏東東港：南端偏東 -->

	<script>
	/* ══ 歡迎頁地圖邏輯 ══════════════════════════════════ */
	(function(){

		/* ── 漁港資料（百分比座標對應 tw.png 原圖） ──
		   tw.png 原圖尺寸約 760×1344。
		   台灣島在圖中：北端約 top 14%、南端約 top 87%，
		   西岸約 left 13%、東岸約 left 82%。
		   以下座標 px/py 均為原圖百分比，JS 會換算為實際像素。
		*/
		var HARBORS = {
			badouzi:  { px: 0.816, py: 0.165 }, /* 基隆八斗子：東北角海岸 */
			nanfangao:{ px: 0.864, py: 0.289 }, /* 宜蘭南方澳：東岸中上   */
			longfeng: { px: 0.416, py: 0.288 }, /* 苗栗龍鳳：西岸中上     */
			wuqi:     { px: 0.316, py: 0.359 }, /* 台中梧棲：西岸中段     */
			anping:   { px: 0.163, py: 0.645 }, /* 台南安平：西南岸       */
			donggang: { px: 0.278, py: 0.755 }, /* 屏東東港 */
		};

		/* 徽章資料（配合 db.js locationDB） */
		var HARBOR_INFO = {
			badouzi:  { name:'基隆八斗子漁港', badge:'北岬海紋章', stars:'★★★★'   },
			nanfangao:{ name:'宜蘭南方澳漁港', badge:'洄光海紋章', stars:'★★★★★'  },
			longfeng: { name:'苗栗龍鳳漁港',   badge:'龍鳳初航章', stars:'★★★'     },
			wuqi:     { name:'台中梧棲漁港',   badge:'中港豐海章', stars:'★'        },
			anping:   { name:'台南安平漁港',   badge:'安平豐海章', stars:'★★'       },
			donggang: { name:'屏東東港漁港',   badge:'黑潮守護章', stars:'★★★★'   },
		};

		/* ── 取得 tw.png 在螢幕上的實際渲染矩形 ──
		   img 是 object-fit:cover / object-position:center top
		   cover：縮放到「短邊填滿容器」，長邊溢出裁切。
		   用 window.innerWidth/Height，不依賴元素 offsetWidth（避免 display:none 時為 0）
		*/
		function getImgRect(){
			var img = document.querySelector('#ws-map-bg img');
			var cW  = window.innerWidth;
			var cH  = window.innerHeight;
			if(!img || !img.naturalWidth || !img.naturalHeight){
				return {left:0, top:0, width:cW, height:cH};
			}
			var nW = img.naturalWidth, nH = img.naturalHeight;
			var scale = Math.max(cW / nW, cH / nH); /* cover */
			var rW = nW * scale, rH = nH * scale;
			/* object-position: center top */
			var left = (cW - rW) / 2;
			var top  = 0;
			return { left:left, top:top, width:rW, height:rH };
		}

		/* ── 將港口氣泡和小船定位到地圖正確座標 ── */
		function positionHarbors(){
			var r = getImgRect();
			if(!r.width) return;
			Object.keys(HARBORS).forEach(function(id){
				var h  = HARBORS[id];
				var el = document.getElementById('wsh-'+id);
				if(!el) return;
				var x = r.left + h.px * r.width;
				var y = r.top  + h.py * r.height;
				el.style.left = x + 'px';
				el.style.top  = y + 'px';
			});
			/* 小船初始位置：右下角面板附近（台灣島南端右側海域） */
			var boat = document.getElementById('ws-boat');
			if(boat && !window._wsBoatMoved){
				var panelEl = document.getElementById('ws-panel');
				var px = panelEl
					? (panelEl.offsetLeft - 28) / window.innerWidth
					: 0.82;
				var py = panelEl
					? (panelEl.offsetTop + panelEl.offsetHeight * 0.3) / window.innerHeight
					: 0.72;
				boat.style.transition = 'none'; /* 初始定位不要動畫 */
				boat.style.left = (px * window.innerWidth)  + 'px';
				boat.style.top  = (py * window.innerHeight) + 'px';
				/* 下一幀恢復 transition */
				requestAnimationFrame(function(){
					boat.style.transition = '';
				});
			}
		}

		/* ── 圖片確保載入後再定位 ── */
		var _img = document.querySelector('#ws-map-bg img');
		function _doPosition(){
			requestAnimationFrame(function(){
				positionHarbors();
			});
		}
		if(_img){
			if(_img.complete && _img.naturalWidth){
				_doPosition();
			} else {
				_img.addEventListener('load', _doPosition);
			}
		}

		/* ── 頁面載入後直接補觸發（應對各種初始顯示時機） ── */
		setTimeout(positionHarbors, 100);
		setTimeout(positionHarbors, 400);

		/* ── resize 時重新定位 ── */
		var _resizeTimer;
		window.addEventListener('resize', function(){
			clearTimeout(_resizeTimer);
			_resizeTimer = setTimeout(positionHarbors, 80);
		});

		/* ══════════════════════════════════════════════
		   天氣海象 + 突發事件系統
		   每次 welcome-screen 顯示時重新抽選一次
		   ══════════════════════════════════════════════ */
		var PORT_IDS = ['badouzi','nanfangao','longfeng','wuqi','anping','donggang'];

		/* 依 weight 加權隨機抽 1 筆 */
		function weightedPick(arr){
			var total = arr.reduce(function(s,o){ return s + o.weight; }, 0);
			var r = Math.random() * total;
			for(var i=0;i<arr.length;i++){
				r -= arr[i].weight;
				if(r <= 0) return arr[i];
			}
			return arr[arr.length-1];
		}

		/* 主運算：回傳 { weather, event, portStatus:{id:true/false}, closedByEvent:{id:eventName} } */
		function rollWeatherAndEvents(){
			var weather = weightedPick(weatherDB);

			/* 1. 依天氣機率，每港獨立丟骰 */
			var portStatus = {};
			PORT_IDS.forEach(function(id){
				var chance = (weather.ports && weather.ports[id] != null) ? weather.ports[id] : 100;
				portStatus[id] = (Math.random() * 100 < chance);
			});

			/* 2. 判定是否觸發事件 */
			var event = null;
			var closedByEvent = {};
			var triggered = Math.random() * 100 < (weather.eventChance || 0);
			if(triggered && typeof eventDB !== 'undefined' && eventDB.length){
				event = weightedPick(eventDB);
				/* 收集所有標 "pick" 的候選港口（無論天氣判定是否已關閉，pick 候選池都看事件表本身） */
				var candidates = PORT_IDS.filter(function(id){
					return event.ports && event.ports[id] === 'pick';
				});
				if(candidates.length){
					var chosen = candidates[Math.floor(Math.random() * candidates.length)];
					portStatus[chosen] = false;
					closedByEvent[chosen] = event.name;
				}
			}

			return { weather: weather, event: event, portStatus: portStatus, closedByEvent: closedByEvent };
		}

		/* 套用結果到 DOM */
		function applyWeatherToUI(result){
			window._wsWeatherResult = result;

			/* 天氣卡片 */
			var wBox = document.getElementById('ws-weather-box');
			var wName = document.getElementById('ws-weather-name');
			var eName = document.getElementById('ws-event-name');
			if(wName) wName.textContent = result.weather.name;
			if(eName){
				if(result.event){
					eName.textContent = result.event.name;
					eName.classList.add('show');
				} else {
					eName.textContent = '';
					eName.classList.remove('show');
				}
			}
			if(wBox) requestAnimationFrame(function(){ wBox.classList.add('show'); });

			/* 港口開放/關閉 */
			PORT_IDS.forEach(function(id){
				var el = document.getElementById('wsh-'+id);
				if(!el) return;
				var isOpen = result.portStatus[id];
				el.classList.toggle('ws-closed', !isOpen);
				var tag = el.querySelector('.ws-h-event-tag');
				if(tag){
					if(!isOpen && result.closedByEvent[id]){
						tag.textContent = result.closedByEvent[id];
						tag.classList.add('show');
					} else {
						tag.textContent = '';
						tag.classList.remove('show');
					}
				}
			});

			/* 若先前選的港口這次被關閉，清除選擇並提示 */
			if(window.selectedLocationId && result.portStatus[window.selectedLocationId] === false){
				window.selectedLocationId = null;
				sessionStorage.removeItem('selectedLocationId');
				document.querySelectorAll('.ws-harbor').forEach(function(el){ el.classList.remove('ws-selected'); });
				var hint = document.getElementById('ws-panel-hint');
				var content = document.getElementById('ws-panel-content');
				if(hint) hint.style.display = 'block';
				if(content) content.style.display = 'none';
				wsShowToast('⚠️ 原出發漁港今日封港，請重新選擇');
			}
		}

		function rollAndApplyWeather(){
			if(typeof weatherDB === 'undefined' || typeof eventDB === 'undefined'){
				return; /* db.js 尚未載入或不存在，略過 */
			}
			var result = rollWeatherAndEvents();
			applyWeatherToUI(result);
		}

		/* ── 選港 ── */
		window.selectedLocationId = sessionStorage.getItem('selectedLocationId') || null;

		window.wsSelectHarbor = function(id){
			/* 保險檢查：已關閉的港口不可選 */
			var elCheck = document.getElementById('wsh-'+id);
			if(elCheck && elCheck.classList.contains('ws-closed')){
				wsShowToast('⛔ 此港口今日封港');
				return;
			}
			/* 取消舊選中 */
			document.querySelectorAll('.ws-harbor').forEach(function(el){
				el.classList.remove('ws-selected');
			});
			/* 設定新選中 */
			var el = document.getElementById('wsh-'+id);
			if(el) el.classList.add('ws-selected');

			window.selectedLocationId = id;
			sessionStorage.setItem('selectedLocationId', id);

			/* 更新面板 */
			var info = HARBOR_INFO[id] || {};
			document.getElementById('ws-panel-harbor-name').textContent = (info.name || id) + ' ' + (info.stars || '');
			document.getElementById('ws-panel-badge').textContent = '🏅 ' + (info.badge || '');
			document.getElementById('ws-panel-hint').style.display    = 'none';
			document.getElementById('ws-panel-content').style.display = 'block';

			/* 移動小船 */
			var r    = getImgRect();
			var h    = HARBORS[id];
			var boat = document.getElementById('ws-boat');
			if(boat && h){
				boat.style.left = (r.left + h.px * r.width)  + 'px';
				boat.style.top  = (r.top  + h.py * r.height) + 'px';
				window._wsBoatMoved = true;
			}
		};

		/* 選港恢復由 MutationObserver 在 welcome-screen 顯示時統一處理 */

		/* ── 自動帶入上次暱稱（頁面載入時即執行，不依賴選港） ── */
		(function(){
			var nameEl = document.getElementById('ws-name-input');
			if(!nameEl) return;
			var last = localStorage.getItem('lastPlayerName');
			if(last) nameEl.value = last;
		})();

		/* ── Toast ── */
		var _toastTimer;
		function wsShowToast(msg){
			var t = document.getElementById('ws-toast');
			if(!t) return;
			t.textContent = msg;
			t.classList.add('show');
			clearTimeout(_toastTimer);
			_toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
		}

		/* ── 難度 ── */
		window.wsSetDiff = function(val, btn){
			if(typeof gameDifficulty !== 'undefined') gameDifficulty = val;
			document.querySelectorAll('.ws-diff-btn')
				.forEach(function(b){ b.classList.remove('ws-active'); });
			btn.classList.add('ws-active');
		};

		/* ── 音效・音樂 ──
		   歡迎頁本身沒有背景音樂，開關只儲存狀態，
		   不在這裡呼叫 bgm.play()，由遊戲開始後的 initGame 處理。
		*/
		var _sfxOn = sessionStorage.getItem('sfxEnabled') !== 'false';
		(function(){
			var btn = document.getElementById('ws-sfx-btn');
			if(!btn) return;
			if(!_sfxOn){ btn.textContent = '🔇'; btn.classList.add('ws-off'); }
		})();
		window.wsToggleSound = function(){
			_sfxOn = !_sfxOn;
			var btn = document.getElementById('ws-sfx-btn');
			if(btn){
				btn.textContent = _sfxOn ? '🔊' : '🔇';
				btn.classList.toggle('ws-off', !_sfxOn);
			}
			if(typeof sfxEnabled !== 'undefined') sfxEnabled = _sfxOn;
			sessionStorage.setItem('sfxEnabled', _sfxOn ? 'true' : 'false');
			/* 歡迎頁不播放 bgm，僅確保關閉時停掉（若遊戲音樂還在響） */
			if(!_sfxOn){
				var bgm = document.getElementById('bgm');
				if(bgm) bgm.pause();
			}
			wsShowToast(_sfxOn ? '🔊 音效已開啟' : '🔇 音效已關閉');
		};

		/* ── 結算報告 ── */
		var _rptOn = sessionStorage.getItem('reportMode') !== 'false';
		function _updateRptBtn(){
			var btn = document.getElementById('ws-rpt-btn');
			if(!btn) return;
			/* 清空舊內容 */
			btn.innerHTML = '';
			var icon = document.createElement('span');
			icon.textContent = '📊';
			if(!_rptOn){ icon.style.filter = 'grayscale(1)'; }
			btn.appendChild(icon);
			if(!_rptOn){
				var x = document.createElement('span');
				x.className = 'ws-rpt-x';
				x.textContent = '✕';
				btn.appendChild(x);
				btn.classList.add('ws-off');
			} else {
				btn.classList.remove('ws-off');
			}
		}
		_updateRptBtn();
		window.wsToggleReport = function(){
			_rptOn = !_rptOn;
			_updateRptBtn();
			if(typeof showSummaryMode !== 'undefined') showSummaryMode = _rptOn;
			sessionStorage.setItem('reportMode', _rptOn ? 'true' : 'false');
			wsShowToast(_rptOn ? '📊 結算報告已開啟' : '📊 結算報告已關閉');
		};

		/* ── 守護漁港（啟航） ── */
		window.wsStartGame = function(){
			if(!window.selectedLocationId){
				wsShowToast('⚠️ 請先選擇出發漁港');
				return;
			}
			/* 保險檢查：避免殘留選擇繞過已封港的港口 */
			var elCheck2 = document.getElementById('wsh-'+window.selectedLocationId);
			if(elCheck2 && elCheck2.classList.contains('ws-closed')){
				wsShowToast('⛔ 此港口今日封港，請重新選擇');
				return;
			}
			var nameEl = document.getElementById('ws-name-input');
			var typedName = nameEl && nameEl.value.trim();
			if(typedName) localStorage.setItem('lastPlayerName', typedName);
			window.playerName = typedName || '守護員';
			sessionStorage.setItem('selectedLocationId', window.selectedLocationId);

			/* 同步結算報告狀態到遊戲中按鈕 */
			if(typeof showSummaryMode !== 'undefined') showSummaryMode = _rptOn;
			var rBtn = document.getElementById('report-control');
			if(rBtn){
				if(_rptOn){
					rBtn.style.opacity = '1';
					rBtn.innerHTML = '📊';
				} else {
					rBtn.style.opacity = '0.85';
					rBtn.innerHTML = '<span style="filter:grayscale(1);display:inline-block;">📊</span>' +
						'<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:900;color:#ff2222;pointer-events:none;">✕</span>';
				}
			}

			/* ── ZOOM IN 到選中漁港後再啟動遊戲 ── */
			var harbDot = document.getElementById('wsh-' + window.selectedLocationId);
			var mapBg   = document.getElementById('ws-map-bg');
			var wsEl    = document.getElementById('welcome-screen');
			if(harbDot && mapBg && wsEl){
				var dotX = parseFloat(harbDot.style.left);
				var dotY = parseFloat(harbDot.style.top);
				var cW   = window.innerWidth;
				var cH   = window.innerHeight;
				/* 計算 transform-origin：以港口為縮放中心 */
				var ox = (dotX / cW * 100).toFixed(1) + '%';
				var oy = (dotY / cH * 100).toFixed(1) + '%';
				wsEl.style.transition        = 'transform 2s cubic-bezier(.4,0,.2,1), opacity 0.8s ease';
				wsEl.style.transformOrigin   = ox + ' ' + oy;
				wsEl.style.transform         = 'scale(2.5)';
				wsEl.style.opacity           = '0';
				setTimeout(function(){
					wsEl.style.transition      = '';
					wsEl.style.transform       = '';
					wsEl.style.transformOrigin = '';
					if(typeof initGame === 'function') initGame();
				}, 2050);
			} else {
				if(typeof initGame === 'function') initGame();
			}
		};

		/* ── 海浪動畫（canvas，台灣島周邊偶發波紋） ── */
		(function(){
			var cv  = document.getElementById('ws-waves');
			if(!cv) return;
			var ctx = cv.getContext('2d');

			/* 波紋物件池 */
			var ripples = [];

			/* tw.png 在畫面上的島嶼邊界（近似橢圓，由 getImgRect 換算）
			   島嶼在原圖中：cx≈50%, cy≈50%, rx≈38%, ry≈40%
			   每次產生波紋時，從橢圓邊界隨機取一點 */
			function randIslandEdge(){
				var r = getImgRect();
				if(!r.width) return null;
				/* 島的橢圓參數（原圖百分比） */
				var icx = 0.49, icy = 0.50, irx = 0.34, iry = 0.38;
				var angle = Math.random() * Math.PI * 2;
				/* 橢圓邊上取點，加少許 jitter */
				var jitter = 0.92 + Math.random() * 0.16;
				var px = icx + Math.cos(angle) * irx * jitter;
				var py = icy + Math.sin(angle) * iry * jitter;
				return {
					x: r.left + px * r.width,
					y: r.top  + py * r.height,
				};
			}

			function addRipple(){
				var pt = randIslandEdge();
				if(!pt) return;
				ripples.push({
					x: pt.x, y: pt.y,
					r: 0,
					maxR: 28 + Math.random() * 22,
					life: 0,          /* 0~1 */
					speed: 0.006 + Math.random() * 0.005,
				});
			}

			/* 每隔 0.9~2s 隨機加一個波紋（原 1.8~4s，頻率 200%） */
			function scheduleRipple(){
				addRipple();
				setTimeout(scheduleRipple, 900 + Math.random() * 1100);
			}

			function resize(){
				cv.width  = window.innerWidth;
				cv.height = window.innerHeight;
			}
			resize();
			window.addEventListener('resize', resize);

			var _rafId;
			function draw(){
				ctx.clearRect(0, 0, cv.width, cv.height);
				for(var i = ripples.length - 1; i >= 0; i--){
					var rp = ripples[i];
					rp.life += rp.speed;
					rp.r = rp.maxR * rp.life;
					var alpha = (1 - rp.life) * 0.38;
					if(alpha <= 0 || rp.life >= 1){
						ripples.splice(i, 1);
						continue;
					}
					ctx.beginPath();
					ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
					ctx.strokeStyle = 'rgba(140,210,255,' + alpha.toFixed(3) + ')';
					ctx.lineWidth = 1.2;
					ctx.stroke();

					/* 第二圈（比第一圈小、稍微慢半拍） */
					if(rp.life > 0.2){
						var r2    = rp.maxR * (rp.life - 0.18);
						var a2    = (1 - (rp.life - 0.18)) * 0.22;
						if(r2 > 0 && a2 > 0){
							ctx.beginPath();
							ctx.arc(rp.x, rp.y, r2, 0, Math.PI * 2);
							ctx.strokeStyle = 'rgba(180,230,255,' + a2.toFixed(3) + ')';
							ctx.lineWidth = 0.8;
							ctx.stroke();
						}
					}
				}
				_rafId = requestAnimationFrame(draw);
			}

			/* 只在 welcome-screen 可見時跑動畫 */
			function startWaves(){
				if(_rafId) return;
				scheduleRipple();
				draw();
			}
			function stopWaves(){
				cancelAnimationFrame(_rafId);
				_rafId = null;
				ripples = [];
			}

			/* 把波浪的 start/stop 暴露給外層統一的 MutationObserver 呼叫 */
			window._wsStartWaves = startWaves;
			window._wsStopWaves  = stopWaves;
		})();

		/* ── 統一 MutationObserver：welcome-screen 顯示時同時定位港口＋啟動波浪＋抽天氣事件 ── */
		var _wsEl = document.getElementById('welcome-screen');
		if(_wsEl){
			new MutationObserver(function(){
				var visible = (_wsEl.style.display !== 'none' && _wsEl.style.display !== '');
				if(visible){
					positionHarbors();
					setTimeout(positionHarbors, 50);
					setTimeout(positionHarbors, 200);
					if(window._wsStartWaves) window._wsStartWaves();
					rollAndApplyWeather();
				} else {
					if(window._wsStopWaves) window._wsStopWaves();
				}
			}).observe(_wsEl, { attributes:true, attributeFilter:['style','class'] });
		}

		/* 頁面首次載入時，若 welcome-screen 一開始就是可見狀態，也要抽一次 */
		if(_wsEl && _wsEl.style.display !== 'none' && _wsEl.style.display !== ''){
			rollAndApplyWeather();
		}

	})();
	</script>
	<div id="tutorial-tooltip"></div>
	<div id="ui-lock"></div>
	<div id="summon-focus-overlay">
		<div id="summon-focus-box">🔍 尋找守護員...<br>等待中...</div>
	</div>

	<script>
		document.addEventListener('contextmenu', e => e.preventDefault());
	</script>

  <script src="intro.js"></script>

  <script>
  /* 預載 tw.png */
  (function(){ var p = new Image(); p.src = 'image/tw.png'; })();

  /* subtitle 排版：
     行1：#intro-title 置中（intro.js 原有）
     行2：subtitle，右側對齊 title 右側，寬 = title 寬 × 65%
     行3：#intro-hint 水平置中（保持原有動畫）
  */
  (function(){
    var sub   = document.getElementById('intro-subtitle');
    var title = document.getElementById('intro-title');
    var hint  = document.getElementById('intro-hint');
    if(!sub || !title) return;

    function place(){
      var tr = title.getBoundingClientRect();
      if(!tr.width) return;

      /* subtitle：緊貼 title 下方，右對齊 title 右側 */
      var w = tr.width * 0.65;
      var subTop = tr.bottom + 12;
      sub.style.width  = w + 'px';
      sub.style.height = 'auto';
      sub.style.left   = (tr.right - w) + 'px';
      sub.style.top    = subTop + 'px';

      /* hint：subtitle 下方置中 */
      if(hint){
        var subH = sub.offsetHeight || 38;
        var hintTop = subTop + subH + 20;
        hint.style.position  = 'absolute';
        hint.style.top       = hintTop + 'px';
        hint.style.left      = '0';
        hint.style.right     = '0';
        hint.style.textAlign = 'center';
        hint.style.marginTop = '0';
      }
    }

    new MutationObserver(function(){
      if(title.classList.contains('done')){
        setTimeout(function(){
          place();
          sub.classList.add('show');
        }, 300);
      }
    }).observe(title, { attributes:true, attributeFilter:['class'] });

    /* intro 開始播放時（intro-screen 被點擊，intro-cs 變可見）隱藏 subtitle */
    var introScreen = document.getElementById('intro-screen');
    if(introScreen){
      introScreen.addEventListener('click', function(){
        setTimeout(function(){
          sub.style.transition = 'opacity 0.4s ease';
          sub.style.opacity    = '0';
          sub.classList.remove('show');
        }, 100);
      }, { once: true });
    }

    window.addEventListener('resize', function(){
      if(sub.classList.contains('show')) place();
    });
  })();
  </script>
